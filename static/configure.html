<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройка задачи — Генерация изображений</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1><i class="ico">🖼️</i> Настройка задачи</h1>
  </header>

  <main class="page page--narrow">
    <section class="card">
      <h2 id="jobTitle">Задача</h2>
      <p class="hint" id="jobFile"></p>

      <div class="field">
        <label>Модель</label>
        <div class="model-options" id="modelOptions"></div>
        <p class="hint">FLUX.2 Klein 9B — лучшее качество, ~20GB VRAM, секунды на генерацию.</p>
      </div>

      <div class="field">
        <label for="variants">Вариантов на промпт</label>
        <select id="variants" class="select">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <p class="hint">Итог на промпт = выбранные модели × варианты.</p>
      </div>

      <div class="field">
        <label for="refMode">Референс (поиск картинки и генерация по ней)</label>
        <select id="refMode" class="select">
          <option value="none" selected>Без референса (обычная генерация)</option>
          <option value="img2img">img2img — переработка найденной картинки</option>
          <option value="multimodal">multimodal — «по мотивам» референса</option>
        </select>
        <p class="hint">По умолчанию ищет картинку по промпту в DuckDuckGo. Можно задать URL/auto в колонке CSV.</p>
      </div>

      <div class="field" id="strengthField" style="display:none">
        <label for="strength">Сила переработки (img2img): <span id="strengthVal">0.7</span></label>
        <input type="range" id="strength" min="0.1" max="1" step="0.05" value="0.7">
        <p class="hint">Меньше = ближе к исходной картинке, больше = свободнее.</p>
      </div>

      <div class="actions">
        <button id="btnRun" class="btn btn-primary">Запустить генерацию</button>
        <a href="/" class="btn btn-outline">Отмена</a>
      </div>
    </section>
  </main>

  <script src="/static/configure.js?v=2"></script>
  <script src="/static/status_bar.js?v=1"></script>
</body>
</html>
