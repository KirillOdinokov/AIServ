<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — AI ENIX</title>
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/ai-enix.css">
</head>
<body class="d-flex flex-column bg-white">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <h1 class="navbar-brand navbar-brand-autodark" style="font-size:2rem;letter-spacing:1px;">
          <span class="brand-accent" style="color:#d60b0b;">AI</span> ENIX
        </h1>
      </div>
      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Вход в систему</h2>
          <form id="loginForm" autocomplete="on">
            <div class="mb-3">
              <label class="form-label" for="username">Логин</label>
              <input type="text" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Пароль</label>
              <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100">Войти</button>
            </div>
            <div id="loginError" class="text-danger mt-3 text-center" style="min-height:18px;"></div>
          </form>
        </div>
      </div>
      <div class="text-center text-secondary mt-3 small">Генерация изображений, видео и текстов</div>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.textContent = '';
      const form = new FormData();
      form.append('username', document.getElementById('username').value);
      form.append('password', document.getElementById('password').value);
      try {
        const res = await fetch('/api/login', { method: 'POST', body: form });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Ошибка входа';
        }
      } catch (ex) {
        err.textContent = 'Ошибка соединения';
      }
    });
  </script>
</body>
</html>
