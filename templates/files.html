{% extends "base.html" %}
{% block title %}AI ENIX — Файлы{% endblock %}

{% block content %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">Файлы</h2>
      <div class="text-secondary mt-1">Проводник каталога output</div>
    </div>
  </div>
</div>

<div class="row row-cards">
  <div class="col-lg-3">
    <div class="card">
      <div class="card-header"><h3 class="card-title">Быстрый доступ</h3></div>
      <div class="card-body p-0">
        <a href="#" class="d-flex align-items-center gap-2 px-3 py-2 text-decoration-none text-body" id="quickRoot" style="border-bottom:1px solid #f0f0f0;">
          <i class="ti ti-folder-filled" style="color:#f59f00;font-size:1.2rem;"></i>
          <span>output</span>
        </a>
      </div>
    </div>
    <div class="card mt-3">
      <div class="card-header"><h3 class="card-title">Этот компьютер</h3></div>
      <div class="card-body">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="ti ti-device-desktop"></i><span>Локальный диск (/)</span>
        </div>
        <div class="progress progress-sm mb-1"><div class="progress-bar" id="diskRootBar" style="width:0%"></div></div>
        <div class="text-secondary small mb-3" id="diskRootText">—</div>

        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="ti ti-database"></i><span>/data</span>
        </div>
        <div class="progress progress-sm mb-1"><div class="progress-bar" id="diskDataBar" style="width:0%"></div></div>
        <div class="text-secondary small" id="diskDataText">—</div>
      </div>
    </div>
  </div>

  <div class="col-lg-9">
    <div class="card">
      <div class="card-header d-flex flex-wrap gap-2 align-items-center">
        <div class="d-flex align-items-center gap-2 flex-grow-1">
          <button class="btn btn-icon btn-outline-secondary btn-sm" id="btnBack" title="Назад"><i class="ti ti-arrow-left"></i></button>
          <button class="btn btn-icon btn-outline-secondary btn-sm" id="btnUp" title="Вверх"><i class="ti ti-arrow-up"></i></button>
          <button class="btn btn-icon btn-outline-secondary btn-sm" id="btnRefresh" title="Обновить"><i class="ti ti-refresh"></i></button>
          <div class="ai-address flex-grow-1" id="addressBar"></div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-icon btn-outline-secondary btn-sm" id="btnViewIcons" title="Крупные значки"><i class="ti ti-grid-dots"></i></button>
          <button class="btn btn-icon btn-outline-secondary btn-sm" id="btnViewList" title="Список"><i class="ti ti-list"></i></button>
          <button class="btn btn-outline-secondary btn-sm" id="btnZip"><i class="ti ti-file-zip"></i> ZIP</button>
        </div>
      </div>
      <div class="card-body p-0" id="fmView"></div>
      <div class="card-footer text-secondary small" id="fmStatus"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/files.js?v=3"></script>
{% endblock %}
