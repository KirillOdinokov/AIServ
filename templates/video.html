{% extends "base.html" %}
{% block title %}AI ENIX — Генерация видео{% endblock %}

{% block content %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">Генерация видео</h2>
      <div class="text-secondary mt-1">Короткие клипы (Wan 2.1 / LTX-Video)</div>
    </div>
  </div>
</div>

<div class="row row-cards">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><h3 class="card-title">Параметры</h3></div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label" for="prompt">Текст промпта</label>
          <textarea id="prompt" class="form-control" rows="4" placeholder="Опишите сцену для видео…"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="negativePrompt">Негативный промпт (опционально)</label>
          <textarea id="negativePrompt" class="form-control" rows="2" placeholder="blurry, low quality, distorted, watermark, text…"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="model">Модель</label>
          <select id="model" class="form-select"></select>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label" for="duration">Длительность (с)</label>
            <input type="number" id="duration" class="form-control" min="1" max="8" step="1" value="5">
            <div class="form-hint">Максимум ~5 секунд (обрежется до лимита модели).</div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label" for="steps">Шаги генерации</label>
            <input type="number" id="steps" class="form-control" min="4" max="60" step="1" value="20">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">FPS</label>
            <div class="d-flex gap-3">
              <label class="form-check"><input class="form-check-input" type="radio" name="fps" value="16" checked><span class="form-check-label">16</span></label>
              <label class="form-check"><input class="form-check-input" type="radio" name="fps" value="25"><span class="form-check-label">25</span></label>
              <label class="form-check"><input class="form-check-input" type="radio" name="fps" value="30"><span class="form-check-label">30</span></label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Разрешение</label>
          <div class="d-flex flex-wrap gap-3">
            <label class="form-check"><input class="form-check-input" type="radio" name="resolution" value="832x480" checked><span class="form-check-label">832×480 (Wan)</span></label>
            <label class="form-check"><input class="form-check-input" type="radio" name="resolution" value="480x480"><span class="form-check-label">480×480 (квадрат)</span></label>
            <label class="form-check"><input class="form-check-input" type="radio" name="resolution" value="768x512"><span class="form-check-label">768×512 (LTX)</span></label>
          </div>
        </div>
        <p class="text-secondary fw-bold" id="eta"></p>
        <button id="btnCreate" class="btn btn-primary">Создать видео</button>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card" id="resultCard" style="display:none">
      <div class="card-header"><h3 class="card-title">Результат</h3></div>
      <div class="card-body">
        <p class="text-secondary" id="status"></p>
        <video id="video" controls class="w-100" style="display:none;"></video>
        <div class="text-danger mt-2" id="error" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/video.js?v=3"></script>
{% endblock %}
