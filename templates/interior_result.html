{% extends "base.html" %}
{% block title %}AI ENIX — Интерьер: результат{% endblock %}

{% block content %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title" id="jobTitle">Задача</h2>
      <div class="text-secondary mt-1" id="jobSubtitle"></div>
    </div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-3 align-items-center mb-2">
      <span id="jobStatus" class="badge bg-secondary-lt">—</span>
      <span id="jobEta" class="text-secondary"></span>
      <span id="jobCounts" class="text-secondary"></span>
    </div>
    <div class="progress progress-sm"><div class="progress-bar" id="progressFill" style="width:0%"></div></div>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-primary btn-sm" id="btnZip" href="#">Скачать ZIP</a>
      <button class="btn btn-outline-secondary btn-sm" id="btnPause">Пауза</button>
      <a class="btn btn-outline-secondary btn-sm" href="/interior">Новая задача</a>
      <button class="btn btn-outline-danger btn-sm" id="btnDelete">Удалить</button>
    </div>
  </div>
</div>

<div class="row row-cards mb-3">
  <div class="col-md-4">
    <div class="card h-100">
      <img id="refImage" class="card-img-top" style="object-fit:contain;max-height:320px;background:#f5f5f5;cursor:pointer;" alt="референс">
      <div class="card-body py-1"><span class="text-secondary small">Референс интерьера</span></div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card h-100">
      <div class="card-body">
        <div class="fw-bold mb-1">Запрос</div>
        <div class="text-secondary" id="userPrompt"></div>
        <div class="mt-2 small text-secondary" id="llmInfo"></div>
        <div class="mt-2 text-danger small" id="llmError" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<div id="variantsList"></div>

<div class="ai-lightbox" id="lightbox">
  <button class="ai-lightbox-close" id="lightboxClose">&times;</button>
  <button class="ai-lightbox-prev" id="lightboxPrev">&#10094;</button>
  <img class="ai-lightbox-img" id="lightboxImg" src="" alt="">
  <button class="ai-lightbox-next" id="lightboxNext">&#10095;</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/interior_result.js?v=1"></script>
{% endblock %}
