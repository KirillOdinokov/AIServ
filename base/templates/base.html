<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI ENIX База{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/ai-enix.css?v=3">
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  {% block head %}{% endblock %}
</head>
<body>
<div class="page">
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid d-flex flex-column h-100">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark mb-0">
        <a href="{{ prefix }}/" class="text-decoration-none d-block">
          <img src="/static/img/logo-light.png" alt="AI ENIX" class="sidebar-logo">
        </a>
      </h1>
      <div class="collapse navbar-collapse flex-grow-1" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3">
          <li class="nav-item {% if active == 'dashboard' %}active{% endif %}">
            <a class="nav-link" href="{{ prefix }}/">
              <span class="nav-link-icon"><i class="ti ti-layout-dashboard"></i></span>
              <span class="nav-link-title">Обзор</span>
            </a>
          </li>
          <li class="nav-item {% if active == 'products' %}active{% endif %}">
            <a class="nav-link" href="{{ prefix }}/products">
              <span class="nav-link-icon"><i class="ti ti-package"></i></span>
              <span class="nav-link-title">Товары</span>
            </a>
          </li>
          <li class="nav-item {% if active == 'sites' %}active{% endif %}">
            <a class="nav-link" href="{{ prefix }}/sites">
              <span class="nav-link-icon"><i class="ti ti-world"></i></span>
              <span class="nav-link-title">Сайты</span>
            </a>
          </li>
          <li class="nav-item {% if active == 'suppliers' %}active{% endif %}">
            <a class="nav-link" href="{{ prefix }}/suppliers">
              <span class="nav-link-icon"><i class="ti ti-truck"></i></span>
              <span class="nav-link-title">Поставщики</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="sidebar-footer mt-auto">
        <div class="sidebar-user">
          <span class="avatar avatar-sm" style="background:#d60b0b;color:#fff;">K</span>
          <div>
            <div class="name">kirill</div>
            <div class="role">Администратор</div>
          </div>
        </div>
        <a href="#" class="logout-link" id="btnLogout">Выйти</a>
      </div>
    </div>
  </aside>

  <div class="page-wrapper">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl d-flex justify-content-between align-items-center">
        <div class="text-secondary">База — товары, цены, прайсы, сайты</div>
        <a href="https://ai.enix.ru:10443/" class="btn btn-outline-secondary btn-sm" target="_blank">AI ENIX ↗</a>
      </div>
    </header>

    <div class="page-body">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </div>

    <footer class="ai-footer">
      <div class="container-xl d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div><span class="footer-title">AI ENIX</span> — База</div>
        <div>© 2026 AI ENIX</div>
      </div>
    </footer>
  </div>
</div>

<script src="/static/vendor/tabler/tabler.min.js"></script>
<script>
  document.getElementById('btnLogout')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login';
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
